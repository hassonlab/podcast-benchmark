colors:
  baseline: '#4C78A8'
  baseline_arbitrary: '#9C755F'
  baseline_glove: '#59A14F'
  baseline_gpt2: '#76B7B2'
  baseline_ridge: '#B07AA1'
  baseline_simple: '#EDC948'
  brainbert: '#54A24B'
  diver: '#F58518'
  popt: '#E45756'
plotting:
  per_region_brains:
    ignore_right_hemisphere: true
    colormaps:
      default: hot
    bounds:
      content_noncontent:
        min: 0.55
      gpt_surprise:
        min: 0.0
      gpt_surprise_multiclass:
        min: 0.5
      iu_boundary:
        min: 0.7
      llm_decoding:
        min: -4.3
      pos:
        min: 0.5
      sentence_onset:
        min: 0.75
      volume_level:
        min: 0.2
      whisper_embedding:
        min: 0.5
      word_embedding:
        min: 0.6
  include_error_bars: true
  check_best_lag_significance: false
  correct_best_lag_significance: false
  best_lag_summary_plot_style: bar
  task_groups:
    Semantic:
    - gpt_surprise
    - gpt_surprise_multiclass
    - sentence_onset
    Syntactic:
    - content_noncontent
    - pos
    Auditory:
    - volume_level
    - iu_boundary
    Mixed:
    - whisper_embedding
    - word_embedding
    - llm_decoding
    - llm_embedding_pretraining
  task_display_names:
    content_noncontent: Content vs. Non-Content
    gpt_surprise: LLM Surprise
    gpt_surprise_multiclass: LLM Surprise Multiclass
    iu_boundary: IU Boundary
    llm_decoding: Brain LLM
    llm_embedding_pretraining: LLM Embedding Pretraining
    pos: Part of Speech
    sentence_onset: Sentence Onset
    volume_level: Audio Envelope
    whisper_embedding: Whisper Embedding
    word_embedding: Word Embedding
  model_display_names:
    baseline: Baseline
    baseline_arbitrary: Arbitrary Embedding Baseline
    baseline_glove: GloVe Baseline
    baseline_gpt2: GPT-2 Baseline
    baseline_ridge: Ridge Baseline
    baseline_simple: Simple Baseline
    brainbert: BrainBERT
    diver: DIVER
    popt: PopT
metrics:
  content_noncontent:
    column: test_roc_auc_mean
    higher_is_better: true
    label: ROC-AUC
    chance_level: 0.5
    min: 0.49
    max: 0.9
  gpt_surprise:
    column: test_corr_mean
    higher_is_better: true
    label: Correlation
    min: 0.0
  gpt_surprise_multiclass:
    column: test_roc_auc_multiclass_mean
    higher_is_better: true
    label: ROC-AUC
    chance_level: 0.5
    min: 0.49
  iu_boundary:
    column: test_roc_auc_mean
    higher_is_better: true
    label: ROC-AUC
    chance_level: 0.5
    min: 0.49
    max: 0.9
  llm_decoding:
    column: test_cross_entropy_mean
    higher_is_better: true
    label: Log-Likelihood
    bar_start: -4.3
    min: -4.3
    chance_level: -4.216
    negate: true
  pos:
    column: test_roc_auc_multiclass_mean
    higher_is_better: true
    label: ROC-AUC
    chance_level: 0.5
    min: 0.49
    max: 0.9
  sentence_onset:
    column: test_roc_auc_mean
    higher_is_better: true
    label: ROC-AUC
    chance_level: 0.5
    min: 0.49
    max: 0.9
  volume_level:
    column: test_corr_mean
    higher_is_better: true
    label: Correlation
    min: 0.0
    max: 0.7
  whisper_embedding:
    column: test_pairwise_accuracy_mean
    higher_is_better: true
    label: Pairwise Accuracy
    chance_level: 0.5
    min: 0.49
    max: 0.9
  word_embedding:
    column: test_word_avg_auc_roc_mean
    higher_is_better: true
    label: Word-Averaged ROC-AUC
    chance_level: 0.5
    min: 0.49
    max: 0.9
