config_setter_name: neural_conv
run_mode: per_subject
task_config:
  task_name: gpt_surprise_task
  data_params:
    dataset_name: brain_treebank
    dataset_params:
      movie: cars-2
    data_root: data/brain-treebank
    subject_ids: [3]
    per_subject_electrodes:
      3: [F2Ia1, F2Ia2, F2Ia3, F2Ia4, F2Ia5, F2Ia6, F2Ia7, F2Ia8,
          F2Ia9, F2Ia10, F2Ia11, F2Ia12, F2Ia13, F2Ia14, F3c1, F3c2]
    use_high_gamma: false
    window_width: 1.0
    preprocessing_fn_name: window_average_neural_data
    preprocessor_params:
      num_average_samples: 32
  task_specific_config:
    labels_path: processed_data/brain_treebank/cars-2/word_labels.csv
training_params:
  batch_size: 64
  epochs: 2
  learning_rate: 0.001
  n_folds: 5
  fold_ids: [1]
  lag: 0
  losses: [mse]
  metrics: [mse, corr]
  early_stopping_metric: mse
  smaller_is_better: true
  tensorboard_logging: false
trial_name: brain_treebank_cars2_surprisal_smoke
model_spec:
  constructor_name: pitom_model
  params:
    conv_filters: 16
    dropout: 0.2
    output_dim: 1
    output_activation: linear
  sub_models: {}
output_dir: results/brain_treebank_smoke
checkpoint_dir: checkpoints/brain_treebank_smoke
tensorboard_dir: event_logs/brain_treebank_smoke
