config_setter_name: neural_conv
run_mode: per_subject
task_config:
  task_name: gpt_surprise_task
  data_params:
    dataset_name: brain_treebank
    dataset_params:
      movie: Cars-2
    data_root: /path/to/brain-treebank
    subject_ids: [1]
    use_high_gamma: true
    window_width: 1.0
    preprocessing_fn_name: window_average_neural_data
    preprocessor_params:
      num_average_samples: 32
  task_specific_config:
    labels_path: processed_data/brain_treebank/cars-2/word_labels.csv
training_params:
  batch_size: 32
  epochs: 50
  learning_rate: 0.001
  n_folds: 5
  min_lag: -1000
  max_lag: 1250
  lag_step_size: 250
  losses: [mse]
  metrics: [mse, corr]
  early_stopping_metric: mse
  smaller_is_better: true
trial_name: brain_treebank_cars2_surprisal
model_spec:
  constructor_name: ensemble_pitom_model
  params:
    conv_filters: 128
    dropout: 0.2
    num_models: 10
    output_dim: 1
    output_activation: linear
  sub_models: {}
