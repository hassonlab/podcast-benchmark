config_setter_name: foundation_feature_cache
task_config:
  task_name: volume_level_decoding_task
  data_params:
    data_root: data
    electrode_file_path: processed_data/all_subject_sig.csv
    use_high_gamma: false
    target_sr: 2048
    use_lip_coords: true
    window_width: 1.0
    preprocessing_fn_name:
    - stft_preprocessing
    - foundation_feature_cache
    preprocessor_params:
    - freq_channel_cutoff: 40
      nperseg: 400
      noverlap: 350
      normalizing: zscore
    - mode: normal
      batch_size: 4
      foundation_config_setter_name: popt_finetune
      foundation_model_spec:
        constructor_name: popt_finetune
        params:
          model_dir: /scratch/gpfs/HASSON/lucy/PODCAST/podcast-benchmark/models/popt/pretrained_model
          brainbert_model_dir: /scratch/gpfs/HASSON/lucy/PODCAST/podcast-benchmark/models/brainbert/pretrained_model
          use_lip_coords: true
          use_brainbert: true
          max_coord_value: 5000
          output_dim: 1
          mlp_layer_sizes: []
          dropout: 0.0
          freeze_foundation: true
          num_frozen_layers: 0
        feature_cache: false
        per_subject_feature_concat: false
        sub_models: {}
    chunked_preprocessing:
      enabled: true
      num_chunks: 8
  task_specific_config:
    audio_path: stimuli/podcast.wav
    target_sr: 512
    audio_sr: 44100
    cutoff_hz: 8.0
    butter_order: 4
    zero_phase: true
    allow_resample_audio: true
    window_size: 200.0
    hop_size: 25.0
training_params:
  batch_size: 4
  epochs: 100
  learning_rate: 1.0e-05
  weight_decay: 1.0e-05
  early_stopping_patience: 10
  n_folds: 5
  min_lag: -1000
  max_lag: 1500
  lag_step_size: 500
  losses:
  - mse
  loss_weights:
  - 1.0
  metrics:
  - mse
  - corr
  - r2
  early_stopping_metric: r2
  smaller_is_better: false
trial_name: popt_supersubject_volume_level
model_spec:
  constructor_name: mlp_probe_decoder
  params:
    layer_sizes:
    - 1
    dropout: 0.0
    use_layer_norm: true
    output_dim: 1
    embedding_dim: 1
  sub_models: {}
