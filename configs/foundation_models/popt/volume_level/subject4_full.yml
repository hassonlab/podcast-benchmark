config_setter_name: foundation_feature_cache
model_spec:
  constructor_name: mlp_probe_decoder
  params:
    layer_sizes:
    - 1
    dropout: 0.0
    use_layer_norm: true
    output_dim: 1
    embedding_dim: 1
  sub_models: {}
task_config:
  data_params:
    data_root: data
    electrode_file_path: null
    target_sr: 2048
    use_high_gamma: false
    use_lip_coords: true
    window_width: 1.0
    subject_ids:
    - 4
    channel_reg_ex: null
    per_subject_electrodes: null
    preprocessing_fn_name:
    - disk_cache_preprocessor
    preprocessor_params:
    - base_preprocessing_fn_name:
      - stft_preprocessing
      - foundation_feature_cache
      base_preprocessor_params:
      - freq_channel_cutoff: 40
        nperseg: 400
        noverlap: 350
        normalizing: zscore
      - mode: normal
        batch_size: 4
        foundation_config_setter_name: popt_finetune
        foundation_model_spec:
          constructor_name: popt_finetune
          params:
            brainbert_model_dir: /scratch/gpfs/HASSON/lucy/PODCAST/podcast-benchmark/models/brainbert/pretrained_model
            dropout: 0.0
            freeze_foundation: true
            max_coord_value: 5000
            mlp_layer_sizes: []
            model_dir: /scratch/gpfs/HASSON/lucy/PODCAST/podcast-benchmark/models/popt/pretrained_model
            num_frozen_layers: 0
            output_dim: 1
            use_brainbert: true
            use_lip_coords: true
          feature_cache: false
          per_subject_feature_concat: false
          sub_models: {}
      mode: normal
  task_name: volume_level_decoding_task
  task_specific_config:
    allow_resample_audio: true
    audio_path: stimuli/podcast.wav
    audio_sr: 44100
    butter_order: 4
    cutoff_hz: 8.0
    hop_size: 25.0
    target_sr: 512
    window_size: 200.0
    zero_phase: true
training_params:
  batch_size: 4
  early_stopping_metric: r2
  early_stopping_patience: 10
  epochs: 100
  lag_step_size: 500
  learning_rate: 1.0e-05
  loss_weights:
  - 1.0
  losses:
  - mse
  max_lag: 1500
  metrics:
  - mse
  - corr
  - r2
  min_lag: -1000
  n_folds: 5
  smaller_is_better: false
  weight_decay: 1.0e-05
trial_name: popt_subject4_full_volume_level
