config_setter_name: foundation_feature_cache
task_config:
  task_name: sentence_onset_task
  data_params:
    data_root: data
    electrode_file_path: processed_data/all_subject_sig.csv
    use_high_gamma: false
    target_sr: 2048
    use_lip_coords: true
    window_width: 1.0
    preprocessing_fn_name:
    - stft_preprocessing
    - foundation_feature_cache
    preprocessor_params:
    - freq_channel_cutoff: 40
      nperseg: 400
      noverlap: 350
      normalizing: zscore
    - mode: per_subject_feature_concat
      batch_size: 4
      foundation_config_setter_name: popt_finetune
      foundation_model_spec:
        constructor_name: popt_finetune
        params:
          model_dir: /scratch/gpfs/HASSON/lucy/PODCAST/podcast-benchmark/models/popt/pretrained_model
          brainbert_model_dir: /scratch/gpfs/HASSON/lucy/PODCAST/podcast-benchmark/models/brainbert/pretrained_model
          use_lip_coords: true
          use_brainbert: true
          max_coord_value: 5000
          output_dim: 1
          mlp_layer_sizes: []
          dropout: 0.0
          freeze_foundation: true
          num_frozen_layers: 0
        feature_cache: false
        per_subject_feature_concat: false
        sub_models: {}
  task_specific_config:
    negatives_per_positive: 5
    negative_margin_s: 0.75
    sentence_csv_path: processed_data/all_sentences_podcast.csv
training_params:
  batch_size: 4
  epochs: 100
  learning_rate: 1.0e-05
  weight_decay: 1.0e-05
  early_stopping_patience: 10
  n_folds: 5
  min_lag: -1000
  max_lag: 1500
  lag_step_size: 500
  losses:
  - bce_with_logits
  loss_weights:
  - 1.0
  metrics:
  - roc_auc
  - sensitivity_logits
  - specificity_logits
  - f1_logits
  - precision_logits
  - acc_logits
  early_stopping_metric: f1_logits
  smaller_is_better: false
trial_name: popt_persubject_concat_sentence_onset
model_spec:
  constructor_name: mlp_probe_decoder
  params:
    layer_sizes:
    - 1
    dropout: 0.0
    use_layer_norm: true
    output_dim: 1
    embedding_dim: 1
  sub_models: {}
