config_setter_name: foundation_feature_cache
task_config:
  task_name: whisper_embedding_decoding_task
  data_params:
    data_root: data
    word_column: word
    electrode_file_path: processed_data/all_subject_sig.csv
    use_high_gamma: false
    target_sr: 2048
    use_lip_coords: true
    window_width: 1.0
    preprocessing_fn_name:
    - foundation_feature_cache
    preprocessor_params:
    - mode: per_subject_feature_concat
      batch_size: 4
      foundation_config_setter_name: popt_finetune
      foundation_model_spec:
        constructor_name: popt_finetune
        params:
          model_dir: /scratch/gpfs/HASSON/lucy/PODCAST/podcast-benchmark/models/popt/pretrained_model
          brainbert_model_dir: /scratch/gpfs/HASSON/lucy/PODCAST/podcast-benchmark/models/brainbert/pretrained_model
          use_lip_coords: true
          use_brainbert: true
          max_coord_value: 5000
          output_dim: 50
          mlp_layer_sizes: []
          dropout: 0.0
          freeze_foundation: true
          num_frozen_layers: 0
        feature_cache: false
        per_subject_feature_concat: false
        sub_models: {}
  task_specific_config:
    embedding_pca_dim: 50
training_params:
  batch_size: 4
  epochs: 100
  learning_rate: 1.0e-05
  weight_decay: 1.0e-05
  early_stopping_patience: 10
  n_folds: 5
  min_lag: -1000
  max_lag: 1500
  lag_step_size: 500
  losses:
  - mse
  loss_weights:
  - 1.0
  metrics:
  - mse
  - corr
  - cosine_sim
  - cosine_dist
  - nll_embedding
  - pairwise_accuracy
  - similarity_entropy
  early_stopping_metric: cosine_sim
  smaller_is_better: false
trial_name: popt_persubject_concat_whisper_embedding
model_spec:
  constructor_name: mlp_probe_decoder
  params:
    layer_sizes:
    - 50
    dropout: 0.0
    use_layer_norm: true
    output_dim: 50
    embedding_dim: 50
  sub_models: {}
