config_setter_name: foundation_feature_cache
task_config:
  task_name: content_noncontent_task
  data_params:
    data_root: data
    electrode_file_path: processed_data/all_subject_sig.csv
    use_high_gamma: false
    target_sr: 500
    signal_unit: uV
    do_drop_bads: true
    window_width: 1.0
    preprocessing_fn_name:
    - disk_cache_preprocessor
    preprocessor_params:
    - base_preprocessing_fn_name:
      - foundation_feature_cache
      base_preprocessor_params:
      - mode: normal
        batch_size: 4
        foundation_config_setter_name: diver_finetune
        foundation_model_spec:
          constructor_name: diver_finetune
          params:
            foundation_dir: /scratch/gpfs/HASSON/lucy/PODCAST/podcast-benchmark/models/diver/pretrained_model/256_mp_rank_00_model_states.pt
            patch_sampling_rate: 500
            patch_size: 50
            d_model: 256
            e_layer: 12
            ft_config: flatten_linear
            deepspeed_pth_format: true
            mup_weights: true
            ft_mup: false
            feature_cache: true
          feature_cache: true
          per_subject_feature_concat: false
          sub_models: {}
  task_specific_config:
    content_noncontent_path: processed_data/df_word_onset_with_pos_class.csv
training_params:
  batch_size: 4
  epochs: 100
  learning_rate: 1.0e-05
  weight_decay: 1.0e-05
  early_stopping_patience: 10
  n_folds: 5
  min_lag: -1000
  max_lag: 1500
  lag_step_size: 500
  losses:
  - bce_with_logits
  loss_weights:
  - 1.0
  metrics:
  - roc_auc
  - sensitivity_logits
  - specificity_logits
  - f1_logits
  - precision_logits
  - acc_logits
  early_stopping_metric: roc_auc
  smaller_is_better: false
trial_name: diver_supersubject_content_noncontent
model_spec:
  constructor_name: mlp_probe_decoder
  params:
    layer_sizes:
    - 1
    dropout: 0.0
    use_layer_norm: true
    output_dim: 1
    embedding_dim: 1
  sub_models: {}
