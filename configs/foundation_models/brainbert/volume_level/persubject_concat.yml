config_setter_name: foundation_feature_cache
task_config:
  task_name: volume_level_decoding_task
  data_params:
    data_root: data
    electrode_file_path: processed_data/all_subject_sig.csv
    use_high_gamma: false
    target_sr: 2048
    window_width: 1.0
    preprocessing_fn_name:
    - disk_cache_preprocessor
    preprocessor_params:
    - base_preprocessing_fn_name:
      - foundation_feature_cache
      base_preprocessor_params:
      - mode: per_subject_feature_concat
        batch_size: 4
        foundation_config_setter_name: brainbert_finetune
        foundation_model_spec:
          constructor_name: brainbert_finetune
          params:
            model_dir: /scratch/gpfs/HASSON/lucy/PODCAST/podcast-benchmark/models/brainbert/pretrained_model
            output_dim: 1
            mlp_layer_sizes: []
            dropout: 0.0
            freeze_foundation: true
            temporal_patches_to_keep: 3
          feature_cache: false
          per_subject_feature_concat: false
          sub_models: {}
      mode: per_subject_feature_concat
  task_specific_config:
    audio_path: stimuli/podcast.wav
    target_sr: 512
    audio_sr: 44100
    cutoff_hz: 8.0
    butter_order: 4
    zero_phase: true
    allow_resample_audio: true
    window_size: 200.0
    hop_size: 100.0
training_params:
  batch_size: 4
  epochs: 100
  learning_rate: 1.0e-05
  weight_decay: 1.0e-05
  early_stopping_patience: 10
  n_folds: 5
  min_lag: -1000
  max_lag: 1500
  lag_step_size: 500
  losses:
  - mse
  loss_weights:
  - 1.0
  metrics:
  - mse
  - corr
  - r2
  early_stopping_metric: r2
  smaller_is_better: false
trial_name: brainbert_persubject_concat_volume_level
model_spec:
  constructor_name: mlp_probe_decoder
  params:
    layer_sizes:
    - 1
    dropout: 0.0
    use_layer_norm: true
    output_dim: 1
    embedding_dim: 1
  sub_models: {}
