config_setter_name: foundation_feature_cache
task_config:
  task_name: pos_task
  data_params:
    data_root: data
    electrode_file_path: processed_data/all_subject_sig.csv
    use_high_gamma: false
    target_sr: 2048
    window_width: 1.0
    preprocessing_fn_name:
    - stft_preprocessing
    - foundation_feature_cache
    preprocessor_params:
    - freq_channel_cutoff: 40
      nperseg: 400
      noverlap: 350
      normalizing: zscore
    - mode: normal
      batch_size: 4
      foundation_config_setter_name: brainbert_finetune
      foundation_model_spec:
        constructor_name: brainbert_finetune
        params:
          model_dir: /scratch/gpfs/HASSON/lucy/PODCAST/podcast-benchmark/models/brainbert/pretrained_model
          output_dim: 5
          mlp_layer_sizes: []
          dropout: 0.0
          freeze_foundation: true
          temporal_patches_to_keep: 3
        feature_cache: false
        per_subject_feature_concat: false
        sub_models: {}
  task_specific_config:
    pos_path: processed_data/df_word_onset_with_pos_class.csv
training_params:
  batch_size: 4
  epochs: 100
  learning_rate: 1.0e-05
  weight_decay: 1.0e-05
  early_stopping_patience: 10
  n_folds: 5
  min_lag: -1000
  max_lag: 1500
  lag_step_size: 500
  losses:
  - cross_entropy
  loss_weights:
  - 1.0
  metrics:
  - roc_auc_multiclass
  - f1
  - acc
  early_stopping_metric: roc_auc_multiclass
  smaller_is_better: false
trial_name: brainbert_supersubject_pos
model_spec:
  constructor_name: mlp_probe_decoder
  params:
    layer_sizes:
    - 5
    dropout: 0.0
    use_layer_norm: true
    output_dim: 5
    embedding_dim: 5
  sub_models: {}
