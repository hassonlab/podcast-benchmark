config_setter_name: foundation_feature_cache
task_config:
  task_name: llm_decoding_task
  data_params:
    data_root: data
    electrode_file_path: processed_data/all_subject_sig.csv
    use_high_gamma: false
    target_sr: 2048
    window_width: 1.0
    preprocessing_fn_name:
    - disk_cache_preprocessor
    preprocessor_params:
    - base_preprocessing_fn_name:
      - stft_preprocessing
      - foundation_feature_cache
      base_preprocessor_params:
      - freq_channel_cutoff: 40
        nperseg: 400
        noverlap: 350
        normalizing: zscore
      - mode: normal
        batch_size: 4
        foundation_config_setter_name: brainbert_finetune
        foundation_model_spec:
          constructor_name: brainbert_finetune
          params:
            model_dir: /scratch/gpfs/HASSON/lucy/PODCAST/podcast-benchmark/models/brainbert/pretrained_model
            temporal_patches_to_keep: 3
            feature_cache: true
          feature_cache: true
          per_subject_feature_concat: false
          sub_models: {}
  task_specific_config:
    max_context: 32
    max_target_tokens: 16
    transcript_path: data/stimuli/podcast_transcript.csv
    prepend_space: true
    model_name: gpt2
    cache_dir: ./model_cache
training_params:
  batch_size: 4
  epochs: 100
  learning_rate: 1.0e-05
  weight_decay: 1.0e-05
  early_stopping_patience: 10
  n_folds: 5
  min_lag: -1000
  max_lag: 1500
  lag_step_size: 500
  losses:
  - cross_entropy
  loss_weights:
  - 1.0
  metrics:
  - acc_llm
  - top_1_acc_llm
  - top_5_acc_llm
  - top_10_acc_llm
  early_stopping_metric: cross_entropy
  smaller_is_better: true
trial_name: brainbert_supersubject_llm_decoding
model_spec:
  constructor_name: mlp_probe_decoder
  params:
    layer_sizes:
    - 768
    dropout: 0.0
    use_layer_norm: true
    output_dim: 768
    embedding_dim: 768
  sub_models: {}
