config_setter_name: foundation_feature_cache
model_spec:
  constructor_name: mlp_probe_decoder
  params:
    layer_sizes:
    - 768
    dropout: 0.0
    use_layer_norm: true
    output_dim: 768
    embedding_dim: 768
  sub_models: {}
task_config:
  data_params:
    data_root: data
    electrode_file_path: null
    target_sr: 2048
    use_high_gamma: false
    window_width: 1.0
    subject_ids:
    - 2
    channel_reg_ex: null
    per_subject_electrodes: null
    preprocessing_fn_name:
    - disk_cache_preprocessor
    preprocessor_params:
    - base_preprocessing_fn_name:
      - stft_preprocessing
      - foundation_feature_cache
      base_preprocessor_params:
      - freq_channel_cutoff: 40
        nperseg: 400
        noverlap: 350
        normalizing: zscore
      - mode: normal
        batch_size: 4
        foundation_config_setter_name: brainbert_finetune
        foundation_model_spec:
          constructor_name: brainbert_finetune
          params:
            dropout: 0.0
            freeze_foundation: false
            mlp_layer_sizes: []
            model_dir: /scratch/gpfs/HASSON/lucy/PODCAST/podcast-benchmark/models/brainbert/pretrained_model
            num_frozen_layers: 0
            output_dim: 768
            temporal_patches_to_keep: 3
          feature_cache: false
          per_subject_feature_concat: false
          sub_models: {}
      mode: normal
  task_name: llm_decoding_task
  task_specific_config:
    cache_dir: ./model_cache
    max_context: 32
    max_target_tokens: 16
    model_name: gpt2
    prepend_space: true
    transcript_path: data/stimuli/podcast_transcript.csv
training_params:
  batch_size: 4
  early_stopping_metric: cross_entropy
  early_stopping_patience: 5
  epochs: 100
  lag_step_size: 500
  learning_rate: 1.0e-05
  loss_weights:
  - 1.0
  losses:
  - cross_entropy
  max_lag: 1500
  metrics:
  - acc_llm
  - top_1_acc_llm
  - top_5_acc_llm
  - top_10_acc_llm
  min_lag: -1000
  n_folds: 5
  smaller_is_better: true
  weight_decay: 1.0e-05
trial_name: brainbert_subject2_full_llm_decoding
