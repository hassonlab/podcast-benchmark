task_config:
  task_name: content_noncontent_task
  data_params:
    data_root: data
    electrode_file_path: processed_data/all_subject_sig.csv
    use_high_gamma: false
    target_sr: 2048
    window_width: 1.0
  task_specific_config:
    content_noncontent_path: processed_data/df_word_onset_with_pos_class.csv
training_params:
  batch_size: 512
  n_folds: 5
  min_lag: -1000
  max_lag: 1500
  lag_step_size: 500
  losses:
  - cross_entropy
  loss_weights:
  - 1.0
  metrics:
  - roc_auc
  early_stopping_metric: roc_auc
  smaller_is_better: false
  ridge_logistic_regression_baseline: true
  tensorboard_logging: false
trial_name: ridge_logistic_regression_content_noncontent_supersubject
model_spec:
  constructor_name: ''
  params:
    Cs:
    - 0.001
    - 0.01
    - 0.1
    - 1.0
    - 10.0
    - 100.0
    cv: 5
    solver: lbfgs
    max_iter: 1000
