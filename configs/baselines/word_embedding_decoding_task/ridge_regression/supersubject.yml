config_setter_name:
- set_input_channels
task_config:
  task_name: word_embedding_decoding_task
  data_params:
    data_root: data
    word_column: word
    electrode_file_path: processed_data/all_subject_sig.csv
    use_high_gamma: true
    window_width: 1.0
    preprocessing_fn_name: window_average_neural_data
    preprocessor_params:
      num_average_samples: 32
  task_specific_config:
    embedding_type: gpt-2xl
    embedding_layer: 24
    embedding_pca_dim: 50
training_params:
  batch_size: 512
  n_folds: 5
  min_lag: -1000
  max_lag: 1500
  lag_step_size: 500
  losses:
  - mse
  loss_weights:
  - 1.0
  metrics:
  - mse
  - corr
  - cosine_sim
  - cosine_dist
  early_stopping_metric: cosine_sim
  smaller_is_better: false
  tensorboard_logging: false
  weight_decay: 0.001
  learning_rate: 0.05
model_spec:
  constructor_name: 'torch_linear_model'
  params:
    output_dim: 50
    num_timepoints: 16
    bias: true
    activation: linear
trial_name: ridge_regression_word_embedding_supersubject
