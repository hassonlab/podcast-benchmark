config_setter_name:
- set_input_channels
task_config:
  task_name: sentence_onset_task
  data_params:
    data_root: data
    preprocessing_fn_name: window_average_neural_data
    preprocessor_params:
      num_average_samples: 32
    electrode_file_path: processed_data/all_subject_sig.csv
    use_high_gamma: true
    window_width: 1.0
  task_specific_config:
    sentence_csv_path: processed_data/all_sentences_podcast.csv
training_params:
  batch_size: 512
  n_folds: 5
  min_lag: -1000
  max_lag: 1500
  lag_step_size: 500
  losses:
  - bce
  loss_weights:
  - 1.0
  metrics:
  - roc_auc
  early_stopping_metric: roc_auc
  smaller_is_better: false
  tensorboard_logging: false
  weight_decay: 0.001
  learning_rate: 0.05
model_spec:
  constructor_name: 'torch_linear_model'
  params:
    output_dim: 1
    bias: true
    num_timepoints: 16
    activation: sigmoid
trial_name: ridge_logistic_regression_sentence_onset_supersubject
