config_setter_name: foundation_feature_cache
model_spec:
  constructor_name: mlp_probe_decoder
  params:
    dropout: 0.0
    embedding_dim: 1
    layer_sizes:
    - 1
    output_dim: 1
    use_layer_norm: true
  sub_models: {}
task_config:
  data_params:
    channel_reg_ex: null
    chunked_preprocessing:
      enabled: true
      num_chunks: 8
    data_root: data
    electrode_file_path: null
    per_subject_electrodes: null
    preprocessing_fn_name:
    - stft_preprocessing
    - foundation_feature_cache
    preprocessor_params:
    - freq_channel_cutoff: 40
      normalizing: zscore
      noverlap: 350
      nperseg: 400
    - batch_size: 4
      foundation_config_setter_name: popt_finetune
      foundation_model_spec:
        constructor_name: popt_finetune
        feature_cache: true
        params:
          brainbert_model_dir: /scratch/gpfs/HASSON/lucy/PODCAST/podcast-benchmark/models/brainbert/pretrained_model
          feature_cache: true
          max_coord_value: 5000
          model_dir: /scratch/gpfs/HASSON/lucy/PODCAST/podcast-benchmark/models/popt/pretrained_model
          use_brainbert: true
          use_lip_coords: true
        per_subject_feature_concat: false
        sub_models: {}
      mode: normal
    subject_ids:
    - 8
    target_sr: 2048
    use_high_gamma: false
    use_lip_coords: true
    window_width: 1.0
  task_name: volume_level_decoding_task
  task_specific_config:
    allow_resample_audio: true
    audio_path: stimuli/podcast.wav
    audio_sr: 44100
    butter_order: 4
    cutoff_hz: 8.0
    hop_size: 100.0
    target_sr: 512
    window_size: 200.0
    zero_phase: true
training_params:
  batch_size: 4
  early_stopping_metric: r2
  early_stopping_patience: 10
  epochs: 100
  lag_step_size: 500
  learning_rate: 1.0e-05
  loss_weights:
  - 1.0
  losses:
  - mse
  max_lag: 1500
  metrics:
  - mse
  - corr
  - r2
  min_lag: -1000
  n_folds: 5
  smaller_is_better: false
  tensorboard_logging: false
  weight_decay: 1.0e-05
  shuffle_targets: true
  num_null_repetitions: 100
  lag: 0
trial_name: popt_subject8_full_volume_level_shuffled_targets
