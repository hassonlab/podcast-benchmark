config_setter_name: foundation_feature_cache
model_spec:
  constructor_name: mlp_probe_decoder
  params:
    dropout: 0.0
    embedding_dim: 1
    layer_sizes:
    - 1
    output_dim: 1
    use_layer_norm: true
  sub_models: {}
task_config:
  data_params:
    channel_reg_ex: null
    data_root: data
    do_drop_bads: true
    electrode_file_path: null
    per_subject_electrodes: null
    preprocessing_fn_name:
    - foundation_feature_cache
    preprocessor_params:
    - batch_size: 4
      foundation_config_setter_name: diver_finetune
      foundation_model_spec:
        constructor_name: diver_finetune
        feature_cache: true
        params:
          d_model: 256
          deepspeed_pth_format: true
          e_layer: 12
          feature_cache: true
          foundation_dir: /scratch/gpfs/HASSON/lucy/PODCAST/podcast-benchmark/models/diver/pretrained_model/256_mp_rank_00_model_states.pt
          ft_config: flatten_linear
          ft_mup: false
          mup_weights: true
          patch_sampling_rate: 500
          patch_size: 50
        per_subject_feature_concat: false
        sub_models: {}
        random_init: true
      mode: normal
    signal_unit: uV
    subject_ids:
    - 8
    target_sr: 500
    use_high_gamma: false
    window_width: 1.0
  task_name: iu_boundary_task
  task_specific_config:
    iu_boundaries_csv_path: processed_data/iu_boundaries.csv
    negative_margin_s: 0.5
    negatives_per_positive: 2
training_params:
  batch_size: 4
  early_stopping_metric: f1_logits
  early_stopping_patience: 10
  epochs: 100
  lag_step_size: 500
  learning_rate: 1.0e-05
  loss_weights:
  - 1.0
  losses:
  - bce_with_logits
  max_lag: 1500
  metrics:
  - roc_auc
  - sensitivity_logits
  - specificity_logits
  - f1_logits
  - precision_logits
  - acc_logits
  min_lag: -1000
  n_folds: 5
  smaller_is_better: false
  tensorboard_logging: false
  weight_decay: 1.0e-05
trial_name: diver_subject8_full_iu_boundary_random_init
