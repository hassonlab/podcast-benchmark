config_setter_name: foundation_feature_cache
model_spec:
  constructor_name: mlp_probe_decoder
  params:
    dropout: 0.0
    embedding_dim: 1
    layer_sizes:
    - 1
    output_dim: 1
    use_layer_norm: true
  sub_models: {}
task_config:
  data_params:
    channel_reg_ex: null
    data_root: data
    electrode_file_path: null
    per_subject_electrodes: null
    preprocessing_fn_name:
    - stft_preprocessing
    - foundation_feature_cache
    preprocessor_params:
    - freq_channel_cutoff: 40
      normalizing: zscore
      noverlap: 350
      nperseg: 400
    - batch_size: 4
      foundation_config_setter_name: brainbert_finetune
      foundation_model_spec:
        constructor_name: brainbert_finetune
        feature_cache: true
        params:
          feature_cache: true
          model_dir: /scratch/gpfs/HASSON/lucy/PODCAST/podcast-benchmark/models/brainbert/pretrained_model
          temporal_patches_to_keep: 3
        per_subject_feature_concat: false
        sub_models: {}
        random_init: true
      mode: normal
    subject_ids:
    - 3
    target_sr: 2048
    use_high_gamma: false
    window_width: 1.0
  task_name: sentence_onset_task
  task_specific_config:
    negative_margin_s: 0.75
    negatives_per_positive: 5
    sentence_csv_path: processed_data/all_sentences_podcast.csv
training_params:
  batch_size: 4
  early_stopping_metric: f1_logits
  early_stopping_patience: 10
  epochs: 100
  lag_step_size: 500
  learning_rate: 1.0e-05
  loss_weights:
  - 1.0
  losses:
  - bce_with_logits
  max_lag: 1500
  metrics:
  - roc_auc
  - sensitivity_logits
  - specificity_logits
  - f1_logits
  - precision_logits
  - acc_logits
  min_lag: -1000
  n_folds: 5
  smaller_is_better: false
  tensorboard_logging: false
  weight_decay: 1.0e-05
  num_null_repetitions: 10
  lag: 0
trial_name: brainbert_subject3_full_sentence_onset_random_init
