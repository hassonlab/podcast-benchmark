config_setter_name: foundation_feature_cache
model_spec:
  constructor_name: mlp_probe_decoder
  params:
    layer_sizes:
    - 1
    dropout: 0.0
    use_layer_norm: true
    output_dim: 1
    input_dropout: 0.5
  sub_models: {}
task_config:
  data_params:
    data_root: data/brain-treebank
    electrode_file_path: null
    target_sr: 2048
    use_high_gamma: false
    window_width: 1.0
    subject_ids:
    - 3
    channel_reg_ex: null
    per_subject_electrodes: null
    preprocessing_fn_name:
    - stft_preprocessing
    - foundation_feature_cache
    preprocessor_params:
    - freq_channel_cutoff: 40
      nperseg: 400
      noverlap: 350
      normalizing: zscore
    - mode: normal
      batch_size: 4
      foundation_config_setter_name: brainbert_finetune
      foundation_model_spec:
        constructor_name: brainbert_finetune
        params:
          model_dir: /scratch/gpfs/HASSON/lucy/PODCAST/podcast-benchmark/models/brainbert/pretrained_model
          temporal_patches_to_keep: 3
          feature_cache: true
        feature_cache: true
        per_subject_feature_concat: false
        sub_models: {}
    dataset_name: brain_treebank
    dataset_params:
      movie: cars-2
    chunked_preprocessing:
      enabled: true
      num_chunks: 20
      cache_dir: .cache/preprocessed_chunks
  task_name: sentence_onset_task
  task_specific_config:
    labels_path: processed_data/brain_treebank/cars-2/word_labels.csv
    negatives_per_positive: 5
training_params:
  tensorboard_logging: false
  batch_size: 4
  early_stopping_metric: f1_logits
  early_stopping_patience: 10
  epochs: 100
  lag_step_size: 100
  learning_rate: 1.0e-05
  loss_weights:
  - 1.0
  losses:
  - bce_with_logits
  max_lag: 1100
  metrics:
  - roc_auc
  - sensitivity_logits
  - specificity_logits
  - f1_logits
  - precision_logits
  - acc_logits
  min_lag: -1000
  n_folds: 5
  smaller_is_better: false
  weight_decay: 0.001
trial_name: brain_treebank_cars2_brainbert_sentence_onset_subject3
run_mode: per_subject
